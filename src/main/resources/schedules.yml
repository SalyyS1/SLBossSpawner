# SLBossSpawner Schedule Configuration
# Rewards are configured in reward.yml

# Example 1: Single boss (old method - still works)
boss:
  mythicmob: SkeletonKing
  # Friendly name shown in spawn/death/bossbar broadcasts. Supports color codes
  # (& and &#RRGGBB). If omitted, the MythicMob id is shown instead.
  name: "&cSkeleton King"
  expire: 3600
  clearOnExpire: true
  # Despawn the boss if NO player is nearby for this many seconds.
  # 0 = disabled (boss stays until it expires or dies). Default is 0.
  no-player-despawn: 0
  time-settings:
    zone: Asia/Ho_Chi_Minh
    time:
      - "12:00"
      - "18:00"
      - "21:00"
  location:
    x: 100
    y: 64
    z: -200
    world: bossworld
    leashRadius: 10
  loadChunks: true
  spawn-sound:
    enabled: true
    sound: ENTITY_ENDER_DRAGON_GROWL
    volume: 1.0
    pitch: 0.8
  broadcast:
    death:
      chat: true
      title: true
    spawn-warning:
      chat: true
      title: true
      bossbar: true
      intervals: [30, 15, 5, 1]

# Example 2: Random boss from list (equal chance)
boss2:
  mythicmob: SkeletonKing, DragonLord, ZombieKing
  random: true
  expire: 3600
  clearOnExpire: true
  time-settings:
    zone: Asia/Ho_Chi_Minh
    time:
      - "12:30"
      - "18:30"
      - "21:30"
  location:
    x: 100
    y: 64
    z: -200
    world: bossworld
    leashRadius: 20
  loadChunks: true
  spawn-sound:
    enabled: true
    sound: ENTITY_WITHER_SPAWN
    volume: 1.0
    pitch: 1.0
  broadcast:
    death:
      chat: true
      title: true
    spawn-warning:
      chat: true
      title: true
      bossbar: true
      intervals: [30, 15, 5, 1]

# Example 3: Random boss by percentage (%)
# Number behind mob name = % chance to spawn
# boss3_rare: 10% | boss3_common: 50% | boss3_epic: 40%
# boss3:
#   mythicmob: RareBoss 10, CommonBoss 50, EpicBoss 40
#   random: true
#   expire: 1800
#   ...

# Example 4: Random boss with per-mob expire time (minutes)
# Each mob has its own despawn timer. No need for "random: true" (auto-enabled).
# "expire" field is the fallback if a mob has 0 or no value.
# boss4:
#   mythicmob:
#     SkeletonKing: 20      # despawns after 20 minutes
#     DragonLord: 30         # despawns after 30 minutes
#     ZombieKing: 45         # despawns after 45 minutes
#   expire: 3600             # fallback (used if mob value = 0)
#   clearOnExpire: true
#   time-settings:
#     zone: Asia/Ho_Chi_Minh
#     time:
#       - "14:00"
#       - "20:00"
#   location:
#     x: 200
#     y: 64
#     z: -300
#     world: bossworld
#     leashRadius: 30
#   loadChunks: true
#   spawn-sound:
#     enabled: true
#     sound: ENTITY_ENDER_DRAGON_GROWL
