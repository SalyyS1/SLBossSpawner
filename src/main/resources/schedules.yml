# SLBossSpawner Schedule Configuration
# Rewards are configured in reward.yml

# Example 1: Single boss (old method - still works)
boss:
  mythicmob: SkeletonKing
  expire: 3600
  clearOnExpire: true
  time-settings:
    zone: Asia/Ho_Chi_Minh
    time:
      - "12:00"
      - "18:00"
      - "21:00"
  location:
    x: 100
    y: 64
    z: -200
    world: bossworld
    leashRadius: 10
  loadChunks: true
  spawn-sound:
    enabled: true
    sound: ENTITY_ENDER_DRAGON_GROWL
    volume: 1.0
    pitch: 0.8
  broadcast:
    death:
      chat: true
      title: true
    spawn-warning:
      chat: true
      title: true
      bossbar: true
      intervals: [30, 15, 5, 1]

# Example 2: Random boss from list (equal chance)
boss2:
  mythicmob: SkeletonKing, DragonLord, ZombieKing
  random: true
  expire: 3600
  clearOnExpire: true
  time-settings:
    zone: Asia/Ho_Chi_Minh
    time:
      - "12:30"
      - "18:30"
      - "21:30"
  location:
    x: 100
    y: 64
    z: -200
    world: bossworld
    leashRadius: 20
  loadChunks: true
  spawn-sound:
    enabled: true
    sound: ENTITY_WITHER_SPAWN
    volume: 1.0
    pitch: 1.0
  broadcast:
    death:
      chat: true
      title: true
    spawn-warning:
      chat: true
      title: true
      bossbar: true
      intervals: [30, 15, 5, 1]

