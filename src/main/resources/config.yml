# SLBossSpawner Configuration

prefix: "&#FF6B6B[&#FFD93DSLBossSpawner&#FF6B6B] "
debug: false

# Language: "en" (English) or "vi" (Vietnamese)
# Uses message.yml for "en", message-vi.yml for "vi"
language: en

# Statistics & Leaderboard System
statistics:
  # Enable the statistics tracking system
  enabled: true
  # Statistics are kept in memory and flushed to <plugin-data>/statistics.yml.
  # A larger value reduces disk writes while the server is busy.
  flush-seconds: 2
  # Maximum entries returned by /slboss top and top placeholders.
  leaderboard-size: 100
