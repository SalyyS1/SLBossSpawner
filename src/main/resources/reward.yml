# SLBossSpawner Reward Configuration
# Reward configuration for each boss.
# Boss ID must match schedules.yml.
# Supports 3 categories: damage, tank, support

boss:
  enabled: true
  item-protection:
    enabled: true
    duration: 60
    expire-action: public  # "public" = anyone can pick it up, "despawn" = remove item
  last-hit-bonus:
    multiplier: 1.5
  global-multiplier: 1.0
  multiply-drop-tables: false

  # Damage category - Top damage dealers to the boss
  damage:
    enabled: true
    tiers:
      1:
        multiplier: 3.0
        commands:
          - "eco give {player} 5000"
        drop-tables:
          - "BossLootTable"
        items:
          - type: vanilla
            material: DIAMOND
            amount: 5
            display-name: "&#FFD93D&lDamage Reward Rank 1"
      2:
        multiplier: 2.0
        commands:
          - "eco give {player} 3000"
        drop-tables: []
        items:
          - type: vanilla
            material: GOLD_INGOT
            amount: 10
            display-name: "&#C0C0C0&lDamage Reward Rank 2"
      3:
        multiplier: 1.5
        commands:
          - "eco give {player} 1000"
        drop-tables: []
        items:
          - type: vanilla
            material: IRON_INGOT
            amount: 15
            display-name: "&#CD7F32&lDamage Reward Rank 3"

  # Tank category - Top damage takers from the boss
  tank:
    enabled: true
    tiers:
      1:
        multiplier: 1.0
        commands:
          - "eco give {player} 3000"
        drop-tables: []
        items:
          - type: vanilla
            material: NETHERITE_SCRAP
            amount: 2
            display-name: "&#4D96FF&lTank Reward Rank 1"
      2:
        multiplier: 1.0
        commands:
          - "eco give {player} 1500"
        drop-tables: []
        items:
          - type: vanilla
            material: GOLDEN_APPLE
            amount: 3
            display-name: "&#4D96FF&lTank Reward Rank 2"

  # Support category - Top score for support
  support:
    enabled: true
    tiers:
      1:
        multiplier: 1.0
        commands:
          - "eco give {player} 2000"
        drop-tables: []
        items:
          - type: vanilla
            material: EMERALD
            amount: 5
            display-name: "&#6BCB77&lSupport Reward Rank 1"
      2:
        multiplier: 1.0
        commands:
          - "eco give {player} 1000"
        drop-tables: []
        items:
          - type: vanilla
            material: LAPIS_LAZULI
            amount: 10
            display-name: "&#6BCB77&lSupport Reward Rank 2"

# Example for item types:
#   - type: vanilla          # Vanilla Minecraft item
#     material: DIAMOND
#     amount: 5
#     display-name: "&#FFD93D&lDisplay Name"
#
#   - type: mmoitems          # Items from MMOItems plugin
#     material: SWORD          # MMOItems Category
#     id: "CUSTOM_SWORD"       # MMOItems ID
#     amount: 1
#
#   - type: mythicmobs         # Items from MythicMobs plugin
#     material: "CustomItem"   # MythicMobs internal name
#     amount: 1

# Boss without rewards: remove section or set enabled: false
